{% extends "base.html" %}{% block title %}Create account · StudyVerse{% endblock %}{% block content %}<section class="card"><p class="eyebrow">YOUR LEARNING SPACE</p><h1>Create student account</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name</label><input name="full_name" autocomplete="name" minlength="2" maxlength="100" required><label>Email address</label><input name="email" type="email" autocomplete="email" maxlength="254" required><label>Password (12+ characters)</label><input name="password" type="password" autocomplete="new-password" minlength="12" required><button>Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
