services:
  - type: web
    name: studyverse-lms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: studyverse-db
          property: connectionString
     
databases:
  - name: studyverse-db
    plan: free
    databaseName: studyverse_lms
    user: studyverse_user
